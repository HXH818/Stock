name: Update BBI

on:
  schedule:
    - cron: "5,35 * * * 0-5"     # 备用：GitHub 自带定时（不准时）
  workflow_dispatch:             # cron-job.org 每 30 分钟从这里触发

concurrency:
  group: bbi-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python bbi.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git commit -m "update BBI data" || echo "no change"
          git push
