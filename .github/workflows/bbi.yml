name: Update BBI

on:
  schedule:
    - cron: "5,35 * * * 0-5"     # 备用：GitHub 自带定时（不准时）
  workflow_dispatch:             # cron-job.org 每 30 分钟从这里触发
    inputs:
      force:
        description: "立即运行选股（不等收盘）"
        type: boolean
        default: false
      notify:
        description: "立即发送一次 Telegram 总结（测试用）"
        type: boolean
        default: false

concurrency:
  group: bbi-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests lxml
      - run: python bbi.py
      - name: 选股（每天收盘后一次）
        run: python screen.py
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
      - name: Telegram 提醒
        run: python notify.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          NOTIFY_NOW: ${{ inputs.notify }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "update BBI data" || echo "no change"
          git pull --rebase origin main
          git push
