<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股监测</title>
<style>
  body{margin:0;background:#0f1115;color:#e6e6e6;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:20px;font-weight:600}
  nav a{color:#aab;margin-left:16px;text-decoration:none;font-size:15px} nav a.on{color:#fff}
  nav button{margin-left:16px;background:#2962ff;border:0;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer}
  .page{display:none} .page.on{display:block}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:0 12px 12px}
  .one{grid-template-columns:1fr}
  .card{background:#171a21;border-radius:8px;padding:10px}
  .card h3{margin:4px 6px 10px;font-size:15px;color:#aab}
  #chart{height:520px} #heatmap{height:560px}
  #list ul{padding:0;margin:0}
  #list li{display:flex;justify-content:space-between;list-style:none;border-bottom:1px solid #252a33}
  .sym{background:none;border:0;color:#e6e6e6;cursor:pointer;font-size:14px;padding:6px}
  .del{background:none;border:0;color:#777;cursor:pointer}
  form{display:flex;gap:6px;margin:8px 0}
  input{flex:1;background:#0f1115;border:1px solid #333;color:#fff;padding:6px;border-radius:4px}
  form button,.btn{background:#2962ff;border:0;color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer}
  .video{border-bottom:1px solid #252a33;padding:14px 8px}
  .video h4{margin:0 0 6px;font-size:17px} .video .date{color:#889;font-size:13px}
  .video .tag{display:inline-block;background:#252a33;border:0;color:#e6e6e6;padding:3px 8px;margin:6px 6px 0 0;border-radius:4px;cursor:pointer}
  .video p{color:#ccd;line-height:1.6;white-space:pre-line}
  a{color:#5b8cff}
  #mark{display:none}
  /* 录制模式 */
  body.rec nav,body.rec #tape,body.rec #list,body.rec #heatCard{display:none}
  body.rec .grid{grid-template-columns:1fr}
  body.rec #chart{height:calc(100vh - 120px)}
  body.rec header{font-size:28px}
  body.rec #chartTitle{font-size:28px;color:#fff}
  body.rec #mark{display:block;position:fixed;right:28px;bottom:20px;opacity:.55;font-size:22px;font-weight:600}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <span id="brand"></span>
  <nav>
    <a href="#home" id="nav-home">看盘</a>
    <a href="#videos" id="nav-videos">视频笔记</a>
    <button onclick="startRec(watch)">🎬 录制</button>
  </nav>
</header>

<!-- 看盘页 -->
<div class="page" id="home">
  <div id="tape"></div>
  <div class="grid">
    <div class="card" id="list">
      <h3>自选股</h3>
      <form id="addForm"><input id="symIn" placeholder="输入代码，如 AMD"><button>添加</button></form>
      <ul id="ul"></ul>
    </div>
    <div class="card"><h3 id="chartTitle">K 线</h3><div id="chart"></div></div>
  </div>
  <div class="grid one" id="heatCard">
    <div class="card"><h3>标普 500 热力图</h3><div id="heatmap"></div></div>
  </div>
</div>

<!-- 视频笔记页 -->
<div class="page" id="videos">
  <div class="grid one"><div class="card" id="videoList"></div></div>
</div>

<div id="mark"></div>

<script>
/* ========= 只需要改这里 ========= */
const CHANNEL = "我的美股频道";   // 频道名，显示在标题和录制水印
const VIDEOS = [                   // 每期视频一条，新的放最上面
  {
    date: "2027-01-05",
    title: "第1期：示例 —— 芯片股怎么看",
    youtube: "",                   // 发布后填 YouTube 链接
    symbols: ["NVDA", "AMD", "TSM"],
    notes: "要点一：……\n要点二：……"
  }
];
/* ================================ */

document.getElementById("brand").textContent = "📈 " + CHANNEL;
document.getElementById("mark").textContent = CHANNEL;
document.title = CHANNEL;

function widget(id, name, cfg){
  const el = document.getElementById(id);
  el.className = "tradingview-widget-container";
  el.innerHTML = '<div class="tradingview-widget-container__widget" style="height:100%"></div>';
  const s = document.createElement("script");
  s.src = `https://s3.tradingview.com/external-embedding/embed-widget-${name}.js`;
  s.async = true;
  s.innerHTML = JSON.stringify(cfg);
  el.appendChild(s);
}

/* 自选股 */
const DEFAULT = ["SPY","QQQ","AAPL","NVDA","MSFT","TSLA"];
let watch = JSON.parse(localStorage.getItem("watch") || "null") || DEFAULT;
const save = () => localStorage.setItem("watch", JSON.stringify(watch));
function renderList(){
  document.getElementById("ul").innerHTML = watch.map(s =>
    `<li><button class="sym" onclick="showChart('${s}')">${s}</button>
     <button class="del" onclick="removeSym('${s}')">✕</button></li>`).join("");
}
function removeSym(s){ watch = watch.filter(x => x !== s); save(); renderList(); }
document.getElementById("addForm").onsubmit = e => {
  e.preventDefault();
  const s = document.getElementById("symIn").value.trim().toUpperCase();
  if (s && !watch.includes(s)) { watch.push(s); save(); renderList(); showChart(s); }
  e.target.reset();
};

function showChart(sym){
  document.getElementById("chartTitle").textContent = sym;
  widget("chart", "advanced-chart", {
    autosize: true, symbol: sym, interval: "D", timezone: "America/New_York",
    theme: "dark", style: "1", locale: "zh_CN", allow_symbol_change: true,
    studies: ["MASimple@tv-basicstudies", "Volume@tv-basicstudies"]
  });
}

/* 录制模式：←/→ 切换股票，Esc 退出 */
let recList = [], recIdx = 0;
function startRec(list){
  if (!list.length) return;
  recList = list; recIdx = 0;
  location.hash = "#home";
  document.body.classList.add("rec");
  showChart(recList[0]);
  document.documentElement.requestFullscreen?.().catch(() => {});
}
function stopRec(){
  document.body.classList.remove("rec");
  if (document.fullscreenElement) document.exitFullscreen();
}
document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("rec")) return;
  if (e.key === "Escape") stopRec();
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    recIdx = (recIdx + (e.key === "ArrowRight" ? 1 : -1) + recList.length) % recList.length;
    showChart(recList[recIdx]);
  }
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) document.body.classList.remove("rec");
});

/* 视频笔记 */
function renderVideos(){
  document.getElementById("videoList").innerHTML = VIDEOS.map((v, i) => `
    <div class="video">
      <h4>${v.title}</h4>
      <span class="date">${v.date}</span>
      ${v.youtube ? ` · <a href="${v.youtube}" target="_blank">在 YouTube 观看</a>` : ""}
      <div>${v.symbols.map(s => `<button class="tag" onclick="location.hash='#home';showChart('${s}')">${s}</button>`).join("")}</div>
      <p>${v.notes}</p>
      <button class="btn" onclick="startRec(VIDEOS[${i}].symbols)">🎬 录制本期</button>
    </div>`).join("");
}

/* 页面切换 */
function route(){
  const p = location.hash === "#videos" ? "videos" : "home";
  document.querySelectorAll(".page").forEach(el => el.classList.toggle("on", el.id === p));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.id === "nav-" + p));
}
window.addEventListener("hashchange", route);

/* 初始化 */
widget("tape", "ticker-tape", {
  symbols: [
    {proName:"FOREXCOM:SPXUSD", title:"标普500"},
    {proName:"FOREXCOM:NSXUSD", title:"纳指100"},
    {proName:"FOREXCOM:DJI", title:"道指"},
    {proName:"CBOE:VIX", title:"VIX"},
    {proName:"TVC:US10Y", title:"10年美债"}
  ],
  colorTheme: "dark", isTransparent: true, displayMode: "adaptive", locale: "zh_CN"
});
widget("heatmap", "stock-heatmap", {
  dataSource: "SPX500", blockSize: "market_cap_basic", blockColor: "change",
  grouping: "sector", locale: "zh_CN", colorTheme: "dark", hasTopBar: true,
  isZoomEnabled: true, hasSymbolTooltip: true, width: "100%", height: "100%"
});
renderList();
renderVideos();
route();
showChart(watch[0] || "SPY");
</script>
</body>
</html>
