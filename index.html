<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股频道</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#ffffff;color:#1a1a1a;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit}
  .top{display:flex;align-items:center;gap:12px;padding:4px 14px;border-bottom:1px solid #e5e7eb}
  .brand{font-size:16px;font-weight:700}
  .brand small{display:block;font-size:12px;color:#888;font-weight:400}
  .search{margin-left:auto;display:flex;background:#f3f4f6;border:1px solid #d1d5db;border-radius:20px;padding:2px 6px 2px 12px}
  .search input{background:none;border:0;color:#111;width:200px;outline:none;font-size:14px}
  .search button{background:none;border:0;color:#666;cursor:pointer;font-size:16px}
  .recbtn{background:#2962ff;border:0;color:#fff;padding:4px 12px;border-radius:6px;cursor:pointer}
  .main{flex:1;display:grid;grid-template-columns:190px 1fr 300px;min-height:0}
  .side{border-right:1px solid #e5e7eb;padding:12px 8px;overflow:auto}
  .side .cap{font-size:12px;color:#999;margin:6px 10px}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;color:#333;font-size:15px;padding:10px 12px;border-radius:6px;cursor:pointer}
  .side button.on{background:#e8eefc;color:#2962ff;font-weight:600}
  .center{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:4px 8px}
  .view{display:none;flex:1;flex-direction:column;min-height:0}
  .view.on{display:flex}
  #chart{flex:1;min-height:560px}
  .fill{flex:1;min-height:640px}
  .right{border-left:1px solid #e5e7eb;display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid #e5e7eb}
  .tabs button{flex:1;background:none;border:0;color:#666;padding:12px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
  .tabs button.on{color:#111;border-bottom-color:#2962ff}
  .pane{display:none;flex:1;flex-direction:column;min-height:0;padding:8px}
  .pane.on{display:flex}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{background:#f1f3f6;border-radius:4px;display:flex;align-items:center}
  .chip button{background:none;border:0;color:#222;cursor:pointer;padding:5px 4px 5px 9px;font-size:13px}
  .chip .x{color:#999;padding:5px 8px 5px 2px}
  #quotes,#hot{flex:1;min-height:400px}
  .add{background:#f3f4f6;border:1px solid #d1d5db;color:#333;padding:6px;border-radius:4px;cursor:pointer;margin-bottom:8px}
  .video{border-bottom:1px solid #e5e7eb;padding:14px 6px}
  .video h4{margin:0 0 6px;font-size:17px} .video .date{color:#888;font-size:13px}
  .tag{background:#f1f3f6;border:0;color:#222;padding:3px 8px;margin:6px 6px 0 0;border-radius:4px;cursor:pointer}
  .video p{color:#444;line-height:1.6;white-space:pre-line}
  .btn{background:#2962ff;border:0;color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer}
  a{color:#2962ff}
  .hh{font-size:18px;margin:6px 4px 10px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .box{border:1px solid #e5e7eb;border-radius:8px;padding:8px}
  .box h3{margin:4px;font-size:16px}
  .row{margin:6px 6px 14px}
  .lbl{font-size:17px;margin-bottom:6px}
  .lbl b{font-weight:700}
  .trk{display:flex;align-items:center;gap:10px}
  .bar{position:relative;flex:1;height:22px;background:#e6e6e6;border-radius:3px}
  .bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#999}
  .bar .fillb{position:absolute;top:0;bottom:0}
  .val{width:64px;text-align:right;font-size:18px;font-weight:600}
  .sub{color:#888;font-size:12px;margin-top:4px}
  .bull{color:#089981} .bear{color:#f23645}
  .note{color:#888;font-size:12px;margin:12px 4px}
  .hh small{font-size:12px;color:#888;font-weight:400;margin-left:8px}
  #mark{display:none}
  body.rec .side,body.rec .right,body.rec .search,body.rec .recbtn{display:none}
  body.rec .main{grid-template-columns:1fr}
  body.rec #mark{display:block;position:fixed;right:28px;bottom:20px;opacity:.55;font-size:22px;font-weight:600}
  @media(max-width:900px){.main{grid-template-columns:1fr}.side{display:flex;overflow-x:auto}.side .cap{display:none}.side button{white-space:nowrap;width:auto}.right{min-height:500px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span id="brand"></span><small id="slogan"></small></div>
  <form class="search" id="searchForm"><input id="searchIn" placeholder="输入代码，如 TSLA"><button>🔍</button></form>
  <button class="recbtn" onclick="startRec(watch)">🎬 录制</button>
</div>

<div class="main">
  <!-- 左侧菜单 -->
  <div class="side" id="side">
    <div class="cap">数据中心</div>
    <button data-view="home">大盘多空</button>
    <button data-view="stock">个股分析</button>
    <button data-view="fin">财务数据</button>
    <button data-view="heat">板块热力图</button>
    <button data-view="news">美股新闻</button>
    <button data-view="cal">财经日历</button>
    <div class="cap">我的频道</div>
    <button data-view="videos">视频笔记</button>
  </div>

  <!-- 中间 -->
  <div class="center">
    <div class="view" id="v-home">
      <h2 class="hh">大盘多空 · BBI <small id="upd"></small></h2>
      <div class="duo" id="bbiCards"></div>
      <p class="note">规则：价格在 BBI 之上为偏多，之下为偏空。BBI = (MA3 + MA6 + MA12 + MA24) / 4。条带范围 ±5%，超出时顶格显示。仅为个人观点，不构成投资建议。</p>
    </div>
    <div class="view" id="v-stock">
      <div id="chart"></div>
    </div>
    <div class="view" id="v-fin"><div id="fin" class="fill"></div></div>
    <div class="view" id="v-heat"><div id="heat" class="fill"></div></div>
    <div class="view" id="v-news"><div id="news" class="fill"></div></div>
    <div class="view" id="v-cal"><div id="cal" class="fill"></div></div>
    <div class="view" id="v-videos"><div id="videoList"></div></div>
  </div>

  <!-- 右侧 -->
  <div class="right">
    <div class="tabs">
      <button data-pane="watch" class="on">我的关注</button>
      <button data-pane="hot">热门股</button>
    </div>
    <div class="pane on" id="p-watch">
      <button class="add" onclick="addSym(cur)">＋ 关注当前股票</button>
      <div class="chips" id="chips"></div>
      <div id="quotes"></div>
    </div>
    <div class="pane" id="p-hot"><div id="hot"></div></div>
  </div>
</div>
<div id="mark"></div>

<script>
/* ========= 常改的设置 ========= */
const CHANNEL = "美股频道";
const SLOGAN  = "";
const DEFAULT = ["AMEX:SPY","NASDAQ:QQQ","NASDAQ:AAPL","NASDAQ:NVDA","NASDAQ:MSFT","NASDAQ:TSLA"];
const STUDIES = ["Volume@tv-basicstudies","MACD@tv-basicstudies"];  // 默认指标
const VIDEOS = [
  { date:"2027-01-05", title:"第1期：示例 —— 芯片股怎么看", youtube:"",
    symbols:["NVDA","AMD","TSM"], notes:"要点一：……\n要点二：……" }
];
/* ============================== */

const $ = id => document.getElementById(id);
$("brand").textContent = CHANNEL; $("slogan").textContent = SLOGAN;
$("mark").textContent = CHANNEL; document.title = CHANNEL;

function widget(id, name, cfg){
  const el = $(id);
  el.className = (el.className.replace("tradingview-widget-container","") + " tradingview-widget-container").trim();
  el.innerHTML = '<div class="tradingview-widget-container__widget" style="height:100%"></div>';
  const s = document.createElement("script");
  s.src = `https://s3.tradingview.com/external-embedding/embed-widget-${name}.js`;
  s.async = true; s.innerHTML = JSON.stringify(cfg);
  el.appendChild(s);
}
const short = s => s.split(":").pop();

/* 当前股票 + 周期 */
let cur = "NASDAQ:TSLA", tf = "D";
const TF = [["1","1分钟"],["5","5分钟"],["15","15分钟"],["30","30分钟"],["60","1小时"],["240","4小时"],["D","日线"],["W","周线"],["M","月线"]];

function drawChart(){
  document.querySelectorAll("#tf button").forEach(b => b.classList.toggle("on", b.dataset.tf === tf));
  widget("chart", "advanced-chart", {
    autosize:true, symbol:cur, interval:tf, timezone:"America/New_York", theme:"light",
    style:"1", locale:"zh_CN", allow_symbol_change:true, hide_side_toolbar:false,
    backgroundColor:"#ffffff", studies:STUDIES
  });
}
function setSymbol(s){
  cur = s.trim().toUpperCase(); $("searchIn").value = short(cur);
  showView("stock");
}
$("searchForm").onsubmit = e => { e.preventDefault(); if ($("searchIn").value.trim()) setSymbol($("searchIn").value); };

/* 首页：BBI 多空 */
const RANGE = 5;   // 条带范围 ±5%
function bbiRow(label, r, unit){
  const col = r.bull ? "#089981" : "#f23645";
  const w = Math.min(Math.abs(r.pct), RANGE) / RANGE * 50;
  const pos = r.pct >= 0 ? `left:50%` : `right:50%`;
  return `<div class="row">
    <div class="lbl">${label}：<b class="${r.bull ? "bull" : "bear"}">${r.bull ? "偏多" : "偏空"}</b></div>
    <div class="trk"><div class="bar"><div class="mid"></div><div class="fillb" style="${pos};width:${w}%;background:${col}"></div></div>
      <div class="val ${r.bull ? "bull" : "bear"}">${r.pct > 0 ? "+" : ""}${r.pct}%</div></div>
    <div class="sub">价格 ${r.close} · BBI ${r.bbi} · 已持续 ${r.bars} ${unit}</div></div>`;
}
function loadBBI(){
  fetch("data.json?t=" + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
    $("upd").textContent = "更新于 " + d.updated;
    $("bbiCards").innerHTML = d.items.map(it => `<div class="box"><h3>${it.name}</h3>
      ${bbiRow("日线", it.d1, "天")}${bbiRow("4H", it.h4, "根")}</div>`).join("");
  }).catch(() => { $("bbiCards").innerHTML = '<p class="note">还没有数据：请到 GitHub 仓库的 Actions → Update BBI → Run workflow 手动运行一次。</p>'; });
}

/* 左侧菜单 */
const loaded = {};
function showView(v){
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "v-" + v));
  document.querySelectorAll("#side button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  if (v === "stock") drawChart();
  if (v === "home" && !loaded.home) loadBBI();
  if (v === "fin") widget("fin", "financials", {symbol:cur, colorTheme:"light", displayMode:"regular", isTransparent:true, locale:"zh_CN", width:"100%", height:"100%"});
  if (v === "heat" && !loaded.heat) widget("heat", "stock-heatmap", {dataSource:"SPX500", blockSize:"market_cap_basic", blockColor:"change", grouping:"sector", locale:"zh_CN", colorTheme:"light", hasTopBar:true, isZoomEnabled:true, hasSymbolTooltip:true, width:"100%", height:"100%"});
  if (v === "news" && !loaded.news) widget("news", "timeline", {feedMode:"market", market:"stock", colorTheme:"light", isTransparent:true, displayMode:"regular", width:"100%", height:"100%", locale:"zh_CN"});
  if (v === "cal" && !loaded.cal) widget("cal", "events", {colorTheme:"light", isTransparent:true, width:"100%", height:"100%", locale:"zh_CN", importanceFilter:"0,1", countryFilter:"us"});
  loaded[v] = true;
}
$("side").onclick = e => { if (e.target.dataset.view) showView(e.target.dataset.view); };

/* 右侧：我的关注 / 热门股 */
let watch; try { watch = JSON.parse(localStorage.getItem("watchlist")) || DEFAULT; } catch(e){ watch = DEFAULT; }
const save = () => { try { localStorage.setItem("watchlist", JSON.stringify(watch)); } catch(e){} };
function renderWatch(){
  $("chips").innerHTML = watch.map(s =>
    `<span class="chip"><button onclick="setSymbol('${s}')">${short(s)}</button><button class="x" onclick="removeSym('${s}')">✕</button></span>`).join("");
  widget("quotes", "market-quotes", {width:"100%", height:"100%", showSymbolLogo:true, isTransparent:true, colorTheme:"light", locale:"zh_CN",
    symbolsGroups:[{name:"我的关注", symbols:watch.map(s => ({name:s, displayName:short(s)}))}]});
}
function addSym(s){ if (!watch.some(w => short(w) === short(s))) { watch.push(s); save(); renderWatch(); } }
function removeSym(s){ watch = watch.filter(x => x !== s); save(); renderWatch(); }

let hotLoaded = false;
document.querySelector(".tabs").onclick = e => {
  const p = e.target.dataset.pane; if (!p) return;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.pane === p));
  document.querySelectorAll(".pane").forEach(el => el.classList.toggle("on", el.id === "p-" + p));
  if (p === "hot" && !hotLoaded){ hotLoaded = true;
    widget("hot", "hotlists", {colorTheme:"light", dateRange:"1D", exchange:"US", showChart:true, locale:"zh_CN", isTransparent:true, showSymbolLogo:true, width:"100%", height:"100%"}); }
};

/* 视频笔记 */
$("videoList").innerHTML = VIDEOS.map((v,i) => `
  <div class="video"><h4>${v.title}</h4><span class="date">${v.date}</span>
  ${v.youtube ? ` · <a href="${v.youtube}" target="_blank">在 YouTube 观看</a>` : ""}
  <div>${v.symbols.map(s => `<button class="tag" onclick="setSymbol('${s}')">${s}</button>`).join("")}</div>
  <p>${v.notes}</p><button class="btn" onclick="startRec(VIDEOS[${i}].symbols)">🎬 录制本期</button></div>`).join("");

/* 录制模式：←/→ 切换，Esc 退出 */
let recList = [], recIdx = 0;
function startRec(list){
  if (!list.length) return;
  recList = list; recIdx = 0;
  document.body.classList.add("rec"); setSymbol(recList[0]);
  document.documentElement.requestFullscreen?.().catch(() => {});
}
document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("rec")) return;
  if (e.key === "Escape"){ document.body.classList.remove("rec"); if (document.fullscreenElement) document.exitFullscreen(); }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
    recIdx = (recIdx + (e.key === "ArrowRight" ? 1 : -1) + recList.length) % recList.length;
    setSymbol(recList[recIdx]);
  }
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("rec"); });

/* 启动 */
renderWatch();
showView("home");
</script>
</body>
</html>
